
name: Continuous Integration workflow
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
    matrix:
      python: [3.13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python}}
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-cov hypothesis freezegun ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Run pytest
        run: pytest tests/test_preference_extractor.py
