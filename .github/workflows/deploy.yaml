# Docker build + push (Github Container Registry)
name: Build & deploy
on:
  push: 
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest


# actions/checkout@v4 -> pulls your repo's code into the GitHub actions runner (so docker build can access it.)
# docker/setup-buildx-action@v3 -> prepares advanced docker build (multi-platform,caching)
# Authenticates with GitHub Container Registry using your account + token.
# Builds a Docker image from your repo and pushes it to GHCR tagged as latest.

# ${{...}} -> github actions expression syntax
# ${{ github.actor }} -> username who triggered the workflow
# ${{ github.repository }} -> repo of the repository
# ${{ secrets.GITHUB_TOKEN }} -> auto-generated token for auth (stored in repo Setting -> Secrets and variables -> Actions).